<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users Management</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />

    <link rel="stylesheet" href="../../style/style.css" />
  </head>

  <body>


    
    <!--//////////////////////////////////////////////////section1//////////////////////////////////////////////////////////////////////////-->
    <section class="dashboard-section">
      <h5>Users Management</h5>
      <p>Organizing accounts, controlling permissions, and monitoring user activity to ensure security and efficiency</p>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="dashboard-card card-total">
            <div class="dashboard-card-header">
              <i class="bi bi-bag-dash-fill icon-yellow"></i> Total Users
            </div>
            <h2>6,300</h2>
            <small>All users in your store</small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-card card-active">
            <div class="dashboard-card-header">
              <div class="check-wrapper">
                <div class="check-inner">
                  <i class="bi bi-check-circle"></i>
                </div>
              </div>
              Active Users
            </div>
            <h2>4,100</h2>
            <small>All active users in your store</small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-card card-pending">
            <div class="dashboard-card-header">
              <i class="bi bi-receipt icon-red"></i> Banned Users
            </div>
            <h2>2,200</h2>
            <small>All restricted users</small>
          </div>
        </div>
      </div>
    </section>
        <!--//////////////////////////////////////////////////section//////////////////////////////////////////////////////////////////////////-->






  </body>
</html>
