<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Wishlist 💖</title>

  <!-- ✅ Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- ✅ Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f9fafb;
      font-family: 'Poppins', sans-serif;
    }

    .navbar {
      background-color: white;
    }

    .wishlist-card {
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      border: none;
      border-radius: 15px;
    }

    .wishlist-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
    }

    .wishlist-card img {
      border-top-left-radius: 15px;
      border-top-right-radius: 15px;
      height: 200px;
      object-fit: cover;
    }

    .btn-remove {
      border-radius: 20px;
      transition: all 0.2s ease;
    }

    .btn-remove:hover {
      background-color: #dc3545;
      color: white;
    }
  </style>
</head>

<body>
  <!-- ✅ Navbar -->
  <nav class="navbar navbar-expand-lg shadow-sm sticky-top">
    <div class="container">
      <a class="navbar-brand fw-bold text-primary" href="home.html">
        <i class="bi bi-heart-fill text-danger me-2"></i>My Wishlist
      </a>
      <a href="cart.html" class="btn btn-outline-primary btn-sm">
        <i class="bi bi-cart3"></i> Cart
      </a>
    </div>
  </nav>

  <!-- ✅ Wishlist Section -->
  <div class="container my-5">
    <h3 class="text-center mb-4 fw-semibold">💖 Your Wishlist</h3>
    <div id="wishlistContainer" class="d-flex flex-wrap justify-content-center"></div>
  </div>

  <!-- ✅ Footer -->
  <footer class="text-center py-3 bg-light border-top">
    <small>Made with 💙 by YourName</small>
  </footer>

  <!-- ✅ Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- ✅ Wishlist Logic -->
  <script>
    const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
    const container = document.getElementById("wishlistContainer");

    if (wishlist.length === 0) {
      container.innerHTML = "<p class='text-center mt-5 text-muted'>Your wishlist is empty 💔</p>";
    } else {
      container.innerHTML = wishlist.map(p => `
        <div class="card wishlist-card m-3 shadow-sm" style="width: 18rem;">
          <img src="${p.image}" class="card-img-top" alt="${p.name}">
          <div class="card-body text-center">
            <h5 class="card-title fw-semibold">${p.name}</h5>
            <p class="text-muted mb-1">${p.description ? p.description.slice(0, 60) + "..." : ""}</p>
            <p class="fw-bold text-primary mb-3">$${p.price}</p>
            <button class="btn btn-outline-danger btn-remove w-100" onclick="removeFromWishlist('${p.id}')">
              <i class="bi bi-trash3"></i> Remove
            </button>
          </div>
        </div>
      `).join('');
    }

    function removeFromWishlist(id) {
      const wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];
      const updated = wishlist.filter(p => p.id !== id);
      localStorage.setItem("wishlist", JSON.stringify(updated));
      location.reload();
    }

    // ✅ جلب قائمة الـ Wishlist من localStorage
function getWishlist() {
  return JSON.parse(localStorage.getItem("wishlist")) || [];
}

// ✅ حفظ الـ Wishlist
function saveWishlist(list) {
  localStorage.setItem("wishlist", JSON.stringify(list));
}

// ✅ إضافة منتج إلى الـ Wishlist
function addToWishlist(product) {
  if (!product || !product.id) {
    alert("❌ Product not found");
    return;
  }

  const wishlist = getWishlist();
  const exist = wishlist.find(item => item.id === product.id);
  if (exist) {
    alert("❤️ This product is already in your wishlist!");
    return;
  }

  wishlist.push(product);
  saveWishlist(wishlist);
  alert(`💖 ${product.name} added to your wishlist!`);
}

  </script>
</body>
</html>
