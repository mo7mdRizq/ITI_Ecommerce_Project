<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create New Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#618674',
            hover: '#4D6B5C',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../../assets/icons/logo 1.png">
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center" style="font-family: 'Poppins';">

    <div class="absolute top-12 left-12">
      <img src="../../assets/images/logo.png" alt="Modevia Logo" class="w-32 md:w-40 lg:w-48" title="Modevia">
    </div>

  <div class="w-full max-w-xl bg-white px-6 py-8">

    <h2 class="text-2xl sm:text-4xl font-semibold text-gray-900 text-center mb-16">
      Reset new password
    </h2>

    
    <form id="resetPasswordForm">
      <div class="relative">
        <input type="password" id="password" placeholder="Password"
          class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-4 px-1 py-2" required />
        <span id="togglePassword1" class="absolute right-2 top-2 text-gray-400 cursor-pointer">
          <img src="../../assets/icons/icons_hide.png" id="hideIcon" class="w-5 h-5">
        </span>
      </div>

      <div class="relative">
        <input type="password" id="confirmPassword" placeholder="Confirm password"
          class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-16 px-1 py-2" required />
        <span id="togglePassword2" class="absolute right-2 top-2 text-gray-400 cursor-pointer">
          <img src="../../assets/icons/icons_hide.png" id="hideIcon1" class="w-5 h-5">
        </span>
      </div>

      <button type="submit"
        class="w-full bg-primary hover:bg-hover text-white text-xl font-bold py-3 rounded-sm shadow-md transition">
        Reset password
      </button>
    </form>
  </div>

  <script src="signup.js"></script>
</body>


</html>
