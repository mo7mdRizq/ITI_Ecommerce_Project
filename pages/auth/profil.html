<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Details</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      background-color: #f8f9fa;
    }

    /* ===== Sidebar ===== */
    .sidebar {
      background-color: #f1f5f1;
      min-height: 90vh;
      padding: 20px;
      border-radius: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.4s ease;
    }

    .profile-img {
      width: 100px;
      height: 100px;
      object-fit: cover;
      border-radius: 50%;
      margin-bottom: 10px;
    }

    .sidebar h5 {
      margin-bottom: 10px;
      text-align: center;
    }

    .sidebar a {
      display: block;
      padding: 10px 15px;
      margin-bottom: 5px;
      border-radius: 5px;
      color: #333;
      text-decoration: none;
      width: 100%;
      text-align: center;
      transition: background-color 0.3s ease, color 0.3s ease;
    }

    .sidebar a:hover {
      background-color: #4D6B5C;
      color: white;
    }

    .sidebar a.active {
      background-color: #618674;
      color: white;
    }

    .save-btn {
      background-color: #618674;
      color: white;
      border: none;
      transition: background-color 0.3s ease;
    }

    .save-btn:hover {
      background-color: #4D6B5C;
    }

    /* ====== Mobile Menu Button ====== */
    .menu-toggle {
      display: none;
      background: none;
      border: none;
      font-size: 1.5rem;
      color: #618674;
      margin-top: 10px;
    }

    /* ====== Responsive Styles ====== */
    @media (max-width: 991px) {
      .sidebar {
        min-height: auto;
      }
    }

    @media (max-width: 767px) {
      .row.equal-height {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        min-height: auto;
        margin-bottom: 15px;
        padding: 15px;
      }

      .sidebar a {
        display: none;
      }

      .sidebar.show-menu a {
        display: block;
        animation: fadeIn 0.4s ease;
      }

      .menu-toggle {
        display: inline-block;
      }

      .profile-img {
        width: 90px;
        height: 90px;
      }

      @keyframes fadeIn {
        from {opacity: 0; transform: translateY(-10px);}
        to {opacity: 1; transform: translateY(0);}
      }
    }
  </style>
</head>
<body>

<div class="container py-4">
  <div class="row g-4 equal-height d-flex">
    <!-- Sidebar -->
    <div class="col-lg-3 col-md-4">
      <div class="sidebar text-center text-lg-start" id="sidebarMenu">
        <img src="man.jpg" alt="Profile" class="profile-img">
        <h5 class="mb-0">user</h5>

        <!-- Mobile toggle button -->
        <button class="menu-toggle" id="toggleMenu">
          <i class="bi bi-chevron-down"></i>
        </button>

        <!-- Links -->
        <a href="#" class="active">Account details</a>
        <a href="#">Change password</a>
        <a href="#">My orders</a>
        <a href="#">Payment info</a>
        <a href="#">My favorite</a>
      </div>
    </div>

    <!-- Form -->
    <div class="col-lg-9 col-md-8">
      <div class="bg-white p-4 rounded shadow-sm flex-grow-1">
        <h4>Account details</h4>
        <form>
          <div class="row g-3">
            <div class="col-12">
              <label for="firstName" class="form-label">First Name</label>
              <input type="text" class="form-control" id="firstName" placeholder="Enter your first name...">
            </div>
            <div class="col-12">
              <label for="lastName" class="form-label">Last Name</label>
              <input type="text" class="form-control" id="lastName" placeholder="Enter your last name...">
            </div>
            <div class="col-12">
              <label for="email" class="form-label">Email</label>
              <input type="email" class="form-control" id="email" placeholder="Enter your email...">
            </div>
            <div class="col-12">
              <label for="phone" class="form-label">Phone Number</label>
              <input type="text" class="form-control" id="phone" placeholder="Enter your phone number...">
            </div>
            <div class="col-12">
              <label for="country" class="form-label">Country</label>
              <input type="text" class="form-control" id="country" placeholder="Enter your country...">
            </div>
            <div class="col-12">
              <label for="city" class="form-label">City</label>
              <input type="text" class="form-control" id="city" placeholder="Enter your city...">
            </div>
          </div>
          <div class="mt-3">
            <button type="submit" class="btn save-btn">Save changes</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>

<script>
  document.getElementById('toggleMenu').addEventListener('click', function() {
    document.getElementById('sidebarMenu').classList.toggle('show-menu');
  });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
