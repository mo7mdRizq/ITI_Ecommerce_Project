<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset Password</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#618674',
            hover: '#4D6B5C',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../../assets/icons/logo 1.png">
</head>

<body class="min-h-screen flex items-center justify-center bg-cover bg-center" style="font-family: 'Poppins';">

    <div class="absolute top-12 left-12">
      <img src="../../assets/images/logo.png" alt="Modevia Logo" class="w-32 md:w-40 lg:w-48" title="Modevia">
    </div>

  <div class="w-full max-w-xl bg-white px-6 py-8">

    <h2 class="text-2xl sm:text-4xl font-semibold text-gray-900 text-center mb-4">
      Forgot your password?
    </h2>

    <p class="text-sm sm:text-lg text-gray-600 text-center mb-20">
      Enter your registered email address and we'll send you a link to reset your password.
    </p>
    <form id="forgotPasswordForm">
      <div>
        <input type="email" id="email" placeholder="Enter your email"
          class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-8 px-1 py-3" required />
      </div>

      <p id="errorMessage" class="text-red-600 text-center mb-4"></p>

      <button type="submit"
        class="w-full bg-primary hover:bg-hover text-white text-xl font-bold py-3 rounded-sm shadow-md transition">
        Send code
      </button>
    </form>
  </div>

  <script src="signup.js"></script>
</body>


</html>
