<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In - Modevia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#618674',
            hover: '#4D6B5C',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">

  <link rel="icon" type="image/png" href="../../assets/icons/logo 1.png">

</head>

<body class="min-h-screen flex flex-col lg:flex-row" style="font-family: 'Poppins';">

  <div class="hidden lg:flex w-1/2 bg-cover bg-center p-12 flex-col justify-between"
    style="background-image: url('../../assets/images/2.jpg');">

    <div>
      <a href="../testHome.html">
        <img src="../../assets/images/logo_footer.png" alt="Modevia Logo" class="w-48" title="Modevia">
      </a>
    </div>

    <div class="mt-auto text-white">
      <h2 class="text-3xl font-bold mb-3 text-shadow-md/30">Welcome back</h2>
      <p class="text-lg max-w-md text-shadow-lg/30">
        Step back into the world of fashion inspiration and continue your
        journey with the latest looks that express your style.
      </p>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex flex-col items-center justify-center min-h-screen bg-white px-4 py-12 relative">

    <div class="lg:hidden absolute top-10 left-10 ">
      <img src="../../assets/images/logo.png" alt="Modevia Logo" class="w-32" title="Modevia">
    </div>

    <div class="w-full max-w-md">
      <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-center mt-12 md:mt-2 mb-12">Sign in</h2>
      <form id="loginForm">
        <div>
          <input type="email" id="email" placeholder="Enter your email"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-4 px-1 py-2" required/>
        </div>
        <div class="relative">
          <input type="password" id="password" placeholder="Enter your password"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-1 px-1 py-2" required/>
          <span id="togglePassword" class="absolute right-2 top-2 text-gray-400 cursor-pointer">
            <img src="../../assets/icons/icons_hide.png" id="hideIcon" class="w-5 h-5">
          </span>
        </div>

        <p id="errorMessage" class="text-red-600 text-center mb-4"></p>

        <div class="text-right mb-12">
          <a href="forgetpass.html" class="text-sm text-gray-800 font-semibold hover:underline">Forget password?</a>
        </div>

        <button type="submit"
          class="w-full bg-primary hover:bg-hover text-white text-xl font-bold py-3 rounded-sm shadow-md transition">
          Sign In
        </button>
      </form>

      <p class="text-center text-gray-700 mt-6">
        Don't have an account?
        <a href="signupuser.html" class="text-primary hover:text-hover font-semibold hover:underline">Sign Up</a>
      </p>

      <!-- <div class="flex items-center my-6">
        <hr class="flex-1 border-primary">
        <span class="mx-2 text-primary font-semibold text-xl">OR</span>
        <hr class="flex-1 border-primary">
      </div>

      <div class="flex justify-center space-x-6">
        <a href="#"
          class="bg-primary text-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-hover transition">
          <img src="../imgs/google.png" class="w-6 h-6" alt="Sign in with Google">
        </a>
        <a href="#"
          class="bg-primary text-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-hover transition">
          <img src="../imgs/fb.png" class="w-6 h-6" alt="Sign in with Facebook">
        </a>
      </div> -->
    </div>
  </div>

  <script src="../../js/signin.js"></script>
</body>

</html>
