<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up - Modevia</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#618674',
            hover: '#4D6B5C',
          },
        },
      },
    };
  </script>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="../../assets/icons/logo 1.png">
</head>

<body class="min-h-screen flex flex-col lg:flex-row" style="font-family: 'Poppins';">

  <div class="hidden lg:flex w-1/2 bg-cover bg-center p-12 flex-col justify-between"
    style="background-image: url('../../assets/images/3.jpg');">

    <div>
      <a href="../testHome.html">
        <img src="../../assets/images/logo_footer.png" alt="Modevia Logo" class="w-48" title="Modevia">
      </a>
    </div>

    <div class="mt-auto text-white">
      <h2 class="text-3xl font-bold mb-3 text-shadow-md/30">Start Your Modevia Journey</h2>
      <p class="text-lg max-w-md text-shadow-lg/30">
        Let your style speak for you! Create your account and 
        start discovering the latest trends made just for you.
      </p>
    </div>
  </div>

  <div class="w-full lg:w-1/2 flex items-center justify-center min-h-screen bg-white px-4 py-8">

    <div class="lg:hidden absolute top-10 left-10 ">
      <img src="../../assets/images/logo.png" alt="Modevia Logo" class="w-32" title="Modevia">
    </div>

    <div class="w-full max-w-md">
      <h2 class="text-2xl md:text-3xl lg:text-4xl font-bold text-center mt-12 lg:mt-2 mb-6">Sign Up</h2>

      <div id="userTypeContainer" class="flex justify-center gap-4 mb-4">
        <div id="goUser"
          class="flex items-center gap-2 cursor-pointer bg-gray-100 rounded-full px-4 py-2 transition 
          hover:bg-gray-200 ">
          <span class="inline-block w-4 h-4 rounded-full border border-gray-400 bg-primary"></span>
          <span class="text-black font-medium">Customer</span>
        </div>
      
        <div id="goSeller"
          class="flex items-center gap-2 cursor-pointer bg-gray-100 rounded-full px-4 py-2 transition 
          hover:bg-gray-200">
          <span class="inline-block w-4 h-4 rounded-full border border-gray-400"></span>
          <span class="text-gray-600 font-medium">Seller</span>
        </div>
      </div>

      <form id="signupUserForm">
        <div>
          <input type="text" id="fullName" placeholder="Full name"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-2 px-1 py-2" required/>
        </div>
        <div>
          <input type="email" id="email" placeholder="Email address"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-2 px-1 py-2" required/>
        </div>
        <div>
          <input type="tel" id="phoneNumber" placeholder="Phone number"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-2 px-1 py-2" required/>
        </div>
        <div class="relative">
          <input type="password" id="password" placeholder="Password"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-2 px-1 py-2" required/>
          <span id="togglePassword1" class="absolute right-2 top-2 text-gray-400 cursor-pointer">
            <img src="../../assets/icons/icons_hide.png" id="hideIcon" class="w-5 h-5">
          </span>
        </div>
        <div class="relative">
          <input type="password" id="confirmPassword" placeholder="Confirm password"
            class="w-full border-b border-gray-400 focus:outline-none focus:border-gray-700 mb-2 px-1 py-2" required/>
          <span id="togglePassword2" class="absolute right-2 top-2 text-gray-400 cursor-pointer">
            <img src="../../assets/icons/icons_hide.png" id="hideIcon1" class="w-5 h-5">
          </span>
        </div>
        
        <p id="errorMessage" class="text-red-600 text-center mb-4"></p>

        <button type="submit"
          class="w-full bg-primary hover:bg-hover text-white text-xl font-bold py-3 rounded-sm shadow-md transition mt-4">
           Sign Up </button>
      </form>

      <p class="text-center text-gray-700 mt-4">
        Already have an account?
        <a href="signin.html" class="text-primary hover:text-hover font-semibold hover:underline">Sign In</a>
      </p>

      <!-- <div class="flex items-center my-4">
        <hr class="flex-1 border-primary">
        <span class="mx-2 text-primary font-semibold text-xl">OR</span>
        <hr class="flex-1 border-primary">
      </div>

      <div class="flex justify-center space-x-6">
        <a href="#"
          class="bg-primary text-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-hover transition">
          <img src="../imgs/google.png" class="w-6 h-6" alt="Sign in with Google">
        </a>
        <a href="#"
          class="bg-primary text-white rounded-full w-12 h-12 flex items-center justify-center hover:bg-hover transition">
          <img src="../imgs/fb.png" class="w-6 h-6" alt="Sign in with Facebook">
        </a>
      </div>       -->
    </div>
  </div>

  <script src="signup.js"></script>
</body>
</html>
