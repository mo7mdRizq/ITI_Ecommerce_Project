      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #cacaca;
      border-radius: 10px;
      padding: 0px 20px;
      transition: all 0.3s ease;

      overflow: hidden;

    .collection-info h6 {
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 1px;

      color: black;
      border-bottom: 2px solid #6c757d;
      padding-bottom: 2px;
      transition: all 0.3s ease;
    }

    .shop-link:hover {
      color: #618674;
      border-color: #618674;
    }

    .collection-card img {
      height: 150px;
      object-fit: contain;
      border-radius: 8px;
    }
