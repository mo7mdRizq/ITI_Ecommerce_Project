<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Collections Section</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    .collection-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #cacaca;
      border-radius: 10px;
      padding: 0px 20px;
      transition: all 0.3s ease;
      background-color: #fff;
      overflow: hidden; 
    }


    .collection-info h6 {
      font-weight: 600;
      margin-bottom: 15px;
      letter-spacing: 1px;
    }

    .shop-link {
      text-decoration: none;
      color: black;
      border-bottom: 2px solid #6c757d;
      padding-bottom: 2px;
      transition: all 0.3s ease;
    }

    .shop-link:hover {
      color: #618674;
      border-color: #618674;
    }

    .collection-card img {
      height: 150px;
      object-fit: contain;
      border-radius: 8px;
    }


  </style>
</head>
<body>

  <div class="container my-5">
    <div class="row g-4 justify-content-center">

      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="collection-card">
          <div class="collection-info">
            <h6>MEN COLLECTION</h6>
            <a href="#" class="shop-link">SHOP NOW</a>
          </div>
          <img src="man.jpg" alt="Men Collection">
        </div>
      </div>

      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="collection-card">
          <div class="collection-info">
            <h6>WOMEN COLLECTION</h6>
            <a href="#" class="shop-link">SHOP NOW</a>
          </div>
          <img src="woman.jpg" alt="Women Collection">
        </div>
      </div>

      <div class="col-lg-4 col-md-6 col-sm-12">
        <div class="collection-card">
          <div class="collection-info">
            <h6>KIDS COLLECTION</h6>
            <a href="#" class="shop-link">SHOP NOW</a>
          </div>
          <img src="boy.jpg" alt="Kids Collection">
        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
