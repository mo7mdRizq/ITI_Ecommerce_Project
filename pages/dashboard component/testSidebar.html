<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Sidebar</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap + Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">

  <style>
    body {
      /* background-color: #f8f9fa; */
      background-color: #f5f5f5;
    }

    .sidebar {
      width: 300px;
      min-height: 80vh;
      height: 70vh;
      padding: 20px;
      background-color: #fff;
      border-right: 1px solid #dee2e6;
      border-radius: 20px;
      margin-top: 80px;
      margin-left: 10px;
    }

    .nav-button {
      display: flex;
      align-items: center;
      padding: 12px 16px;
      border: 1px solid #618674;
      border-radius: 8px;
      margin-bottom: 12px;
      font-weight: 600;
      color: #618674;
      background-color: #fff;
      text-decoration: none;
      transition: background-color 0.3s;
    }

    .nav-button:hover {
      background-color: #4D6B5C;
      color: white;
    }

    .nav-button i {
      margin-right: 10px;
      font-size: 18px;
    }

    .nav-button.active {
      background-color: #618674;
      color: #fff;
      border: none;
    }

    .nav-button.active:hover {
      background-color: #4D6B5C;
      color: #fff;
    }

    @media (max-width: 991.98px) {
      .sidebar {
        display: none;
      }
    }

    @media (min-width: 992px) {
      .offcanvas {
        display: none;
      }
    }

    .main-content {
      margin-left: 250px;
    }

  </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-light bg-light px-3 shadow fixed-top">
        <div class="container-fluid d-flex align-items-center justify-content-between">
    
            <!-- Brand -->
            <a class="navbar-brand" href="../index.html" id="brand">
                <img src="../../assets/images/logo.png" alt="Logo" class="logoImg" style="width: 100px;"/>
            </a>
        
            <!-- Center Links - Collapse -->
            <div class="collapse navbar-collapse justify-content-center order-lg-2" id="navbarNav">
                <ul class="navbar-nav">
                <li class="nav-item mx-2">
                    <a class="nav-link main-nav-link active" href="/">Home</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link main-nav-link" href="">Shop</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link main-nav-link" href="">About</a>
                </li>
                <li class="nav-item mx-2">
                    <a class="nav-link main-nav-link" href="#footer">Contact</a>
                </li>
                <li class="nav-item me-5" id="dashboard">
                    <a class="nav-link main-nav-link" href="">dashboard</a>
                </li>

                
                </ul>

                <form class="d-flex align-items-center" role="search" style="width: 300px;">
                    <input class="form-control form-control-sm rounded-4 ps-3" type="search" placeholder="Search..." aria-label="Search">
                </form>

            </div>
        
            <!-- Right Side -->
            <div class="d-flex align-items-center gap-4 order-lg-3 ms-auto">

        
                <a class="nav-link cart-icon-container position-relative" href="#">
                    <i>
                        <img src="../../assets/icons/shopping-cart.svg" alt="">
                    </i>
                </a>
                <a class="nav-link cart-icon-container position-relative" href="#">
                    <i>
                        <img src="../../assets/icons/profileIcon.svg" alt="">
                    </i>
                </a>
        
                <!-- Navar Toggler -->
                <button class="navbar-toggler ms-2 border-0" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">

                     <img src="../../assets/icons/menu.svg">
                </button>
            </div>
    
        </div>
    </nav>




<!-- Navbar for small screens -->
<nav class="navbar bg-white d-lg-none px-3 shadow-sm">
  <button class="btn btn-outline-dark" data-bs-toggle="offcanvas" data-bs-target="#mobileSidebar">
    <i class="bi bi-list"></i>
  </button>
  <span class="navbar-brand ms-3 fw-bold">Dashboard</span>
</nav>

<!-- Offcanvas Sidebar (Mobile / Tablet) -->
<div class="offcanvas offcanvas-start" tabindex="-1" id="mobileSidebar">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Menu</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
  </div>
  <div class="offcanvas-body">
    <a href="dashboard.html" class="nav-button active">
      <i class="bi bi-speedometer2"></i> Dashboard Overview
    </a>
    <a href="products.html" class="nav-button">
      <i class="bi bi-box"></i> Product Management
    </a>
    <a href="orders.html" class="nav-button">
      <i class="bi bi-journal-text"></i> Order Management
    </a>
    <hr>
    <a href="settings.html" class="nav-button">
      <i class="bi bi-gear"></i> Setting
    </a>
    <a href="logout.html" class="nav-button">
      <i class="bi bi-box-arrow-left"></i> Log Out
    </a>
  </div>
</div>

<!-- Desktop Sidebar -->
<div class="sidebar d-none d-lg-block position-fixed">
  <a href="dashboard.html" class="nav-button active">
    <i class="bi bi-speedometer2"></i> Dashboard Overview
  </a>
  <a href="products.html" class="nav-button">
    <i class="bi bi-box"></i> Product Management
  </a>
  <a href="orders.html" class="nav-button">
    <i class="bi bi-journal-text"></i> Order Management
  </a>
  <hr>
  <a href="settings.html" class="nav-button">
    <i class="bi bi-gear"></i> Setting
  </a>
  <a href="logout.html" class="nav-button">
    <i class="bi bi-box-arrow-left"></i> Log Out
  </a>
</div>


<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

<!-- Optional: Auto-highlight active link by URL -->
<script>
  const links = document.querySelectorAll('.nav-button');
  const currentUrl = window.location.pathname;

  links.forEach(link => {
    if (link.getAttribute('href') && currentUrl.includes(link.getAttribute('href'))) {
      link.classList.add('active');
    } else {
      link.classList.remove('active');
    }
  });
</script>

</body>
</html>
