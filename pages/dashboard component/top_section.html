<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Products Management</title>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    />
    <link rel="stylesheet" href="../../style/style.css" />
  </head>

  <body>




    
    <!--//////////////////////////////////////////////////section1//////////////////////////////////////////////////////////////////////////-->
    <section class="dashboard-section">
      <h5>Products Management</h5>
      <p>Manage and track all your website products here</p>

      <div class="row g-3">
        <div class="col-md-4">
          <div class="dashboard-card card-total">
            <div class="dashboard-card-header">
              <i class="bi bi-bag-dash-fill icon-yellow"></i> Total Products
            </div>
            <h2>4,500</h2>
            <small>All products in your store</small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-card card-active">
            <div class="dashboard-card-header">
              <div class="check-wrapper">
                <div class="check-inner">
                  <i class="bi bi-check-circle"></i>
                </div>
              </div>
              Available Products
            </div>
            <h2>3,500</h2>
            <small>Currently available products</small>
          </div>
        </div>

        <div class="col-md-4">
          <div class="dashboard-card card-pending">
            <div class="dashboard-card-header">
              <i class="bi bi-receipt icon-red"></i> Out of Stock
            </div>
            <h2>1,000</h2>
            <small>Out of stock products</small>
          </div>
        </div>
      </div>
    </section>
    <!--//////////////////////////////////////////////////section//////////////////////////////////////////////////////////////////////////-->





  </body>
</html>
