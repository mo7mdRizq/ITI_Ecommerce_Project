<!DOCTYPE html>

  <style>
    body {
      background-color: #f9fafc;
      font-family: 'Poppins', sans-serif;
    }

    .product-container {
      background: #fff;
      border-radius: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.08);
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .product-container:hover {
      box-shadow: 0 10px 30px rgba(0,0,0,0.12);
    }

    .product-image {
      width: 100%;
      height: 100%;
      max-height: 500px;
      object-fit: cover;
    }

    .product-info {
      padding: 40px;
    }

    .product-title {
      font-size: 2rem;
      font-weight: 700;
    }

    .product-category {
      text-transform: uppercase;
      color: #6c757d;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }

    .product-price {
      font-size: 1.8rem;
      font-weight: 700;
      color: #198754;
    }

    .btn-add-cart {
      background-color: #198754;
      color: #fff;
      border-radius: 10px;
      padding: 12px 25px;
      font-size: 1rem;
      transition: all 0.3s ease;
    }

    .btn-add-cart:hover {
      background-color: #157347;
      transform: translateY(-2px);
    }

    .rating i {
      color: #ffc107;
      font-size: 1.2rem;
    }

    .review-card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
      padding: 20px;
      margin-bottom: 15px;
    }

    .review-card h6 {
      font-weight: 600;
    }

    .back-btn {
      text-decoration: none;
      color: #6c757d;
      font-weight: 500;
      transition: 0.3s;
    }

    .back-btn:hover {
      color: #000;
    }

    @media (max-width: 768px) {
      .product-info { padding: 20px; }
      .product-title { font-size: 1.5rem; }
    }
  </style>
</head>
<body>

  <div class="container py-5 mt-5">

  </div>

  <script>
    function loadProductDetails() {
      const p = JSON.parse(localStorage.getItem('selectedProduct'));
      const container = document.getElementById('productDetails');

      if (!p) {
        container.innerHTML = `
          <div class="col-12 text-center py-5">
            <div class="alert alert-warning">No product selected.</div>
          </div>`;
        return;
      }

      const placeholder = 'https://via.placeholder.com/600x450?text=No+Image';
      const imgSrc = p.image && (p.image.startsWith('data:') || p.image.startsWith('http'))
        ? p.image
        : placeholder;

      container.innerHTML = `
        <div class="col-md-6">
          <img src="${imgSrc}" alt="${p.name}" class="product-image">
        </div>
        <div class="col-md-6">
          <div class="product-info d-flex flex-column justify-content-center h-100">
            <h6 class="product-category">${p.category || 'Uncategorized'}</h6>
            <h2 class="product-title mb-2">${p.name}</h2>
            <div class="rating mb-3">
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-fill"></i>
              <i class="bi bi-star-half"></i>
              <i class="bi bi-star"></i>
            </div>
            <h4 class="product-price mb-3">$${p.price}</h4>
            <p class="mb-3 text-muted">${p.description || 'No description available.'}</p>
            <p><strong>Stock:</strong> ${p.stock || 'Not specified'}</p>
            <button class="btn btn-add-cart mt-4 w-50" id="addToCartBtn">
              <i class="bi bi-cart-plus me-2"></i>Add to Cart
            </button>
          </div>
        </div>
      `;

      document.getElementById('addToCartBtn').addEventListener('click', () => {
        const cart = JSON.parse(localStorage.getItem('cart')) || [];
        const exist = cart.find(item => item.name === p.name && item.price === p.price);
        if (exist) exist.qty = (exist.qty || 1) + 1;
        else cart.push({ ...p, qty: 1 });
        localStorage.setItem('cart', JSON.stringify(cart));
        alert(`${p.name} added to cart ✅`);
      });
    }

    document.addEventListener('DOMContentLoaded', loadProductDetails);
  </script>

</body>
</html>
